<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0}
body{width:2400px;height:1350px;background:radial-gradient(circle at 80% 10%,#2a1590 0%,#130160 55%,#0b0040 100%);font-family:-apple-system,"SF Pro Display",Helvetica,sans-serif;color:#fff;overflow:hidden;position:relative}
.copy{position:absolute;left:130px;top:50%;transform:translateY(-50%);width:620px}

.tags{display:flex;flex-wrap:wrap;gap:14px}

<div class="copy">

</div>
<div class="phones">
